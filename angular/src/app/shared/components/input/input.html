<div class="relative">
  <input
    [type]="inputType()"
    [id]="inputId()"
    [name]="name() || inputId()"
    [value]="value()"
    [placeholder]="placeholder() || ''"
    [disabled]="disabled()"
    (input)="onInput($event)"
    [class]="classes()"
    required
  />
  @let iconName = icon();
  @if (iconName) {
    @if (type() === 'password') {
      <button
        type="button"
        class="absolute right-4 top-1/2 -translate-y-1/2 cursor-pointer text-gray-500 flex content-center"
        [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
        (click)="togglePassword()"
      >
        <ng-icon [name]="iconName" size="18" />
      </button>
    } @else {
      <ng-icon
        [name]="iconName"
        size="18"
        class="pointer-events-none absolute right-4 top-1/2 -translate-y-1/2 text-gray-500"
      />
    }
  }
</div>
