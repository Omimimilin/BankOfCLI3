<div class="flex items-center gap-(--space-s) px-6 pt-6 pb-2 bg-[#F8F8F8]">
  <span
    class="flex size-11 shrink-0 items-center justify-center rounded-full border font-bold text-(length:--step-4) {{
      badge
    }}"
    aria-hidden="true"
    >$</span
  >
  <div class="min-w-0">
    <h1 mat-dialog-title class="m-0! p-0! font-bold! text-gray-900 text-(length:--step-5)!">
      New {{ title }}
    </h1>
    <p class="truncate text-(--primary-dark-30) text-(length:--step-0)">
      From account {{ data.accountId }}
    </p>
  </div>
</div>

<mat-dialog-content class="bg-[#F8F8F8]">
  <div class="grid grid-cols-1 gap-(--space-s) pt-2 sm:grid-cols-2">
    <app-card class="flex flex-col gap-(--space-2xs) shadow-none">
      <label
        for="amount"
        class="font-semibold tracking-wide uppercase text-(--primary-dark-30) text-(length:--step--1)"
      >
        Amount (USD)
      </label>
      <app-input
        [type]="'number'"
        inputId="amount"
        [(value)]="amount"
        class="font-semibold text-black text-(length:--step-4)"
      />
      @if (overMax()) {
        <span role="alert" class="text-red-600 text-(length:--step--1)">
          Maximum amount is {{ max.toLocaleString('en-US') }}.
        </span>
      }
    </app-card>

    @if (data.transactionType == 'TRANSFER_IN' || data.transactionType == 'TRANSFER_OUT') {
      <app-card class="flex flex-col gap-(--space-2xs) shadow-none">
        <label
          for="desAccount"
          class="font-semibold tracking-wide uppercase text-(--primary-dark-30) text-(length:--step--1)"
        >
          Destination account
        </label>
        <app-input
          type="text"
          inputId="desAccount"
          placeholder="ACT-1002"
          [(value)]="destinationAccount"
          class="font-semibold text-black text-(length:--step-4)"
        />
      </app-card>
    }

    <app-card class="flex flex-col gap-(--space-2xs) shadow-none sm:col-span-2">
      <label
        for="Notes"
        class="font-semibold tracking-wide uppercase text-(--primary-dark-30) text-(length:--step--1)"
      >
        Notes <span class="font-normal normal-case">(optional)</span>
      </label>
      <app-input
        [type]="'text'"
        inputId="Notes"
        [(value)]="notes"
        class="w-full text-black text-(length:--step-1)"
      />
    </app-card>
  </div>
</mat-dialog-content>

<mat-dialog-actions
  class="flex flex-col-reverse gap-(--space-s) px-6! pb-6! sm:flex-row sm:justify-end bg-[#F8F8F8]"
>
  <!-- mat-dialog-close closes the dialog. With no value, the result is undefined. -->
  <button
    mat-dialog-close
    class="cursor-pointer rounded-xl border-2 border-(--primary-white-70) px-[1em] py-[0.75em] font-semibold! text-(--primary-dark-20) text-(length:--step-1)! transition hover:bg-(--primary-white-90) w-full sm:min-w-40"
  >
    Cancel
  </button>
  <!-- [mat-dialog-close]="true" closes the dialog and sends `true` back to the parent. -->
  <div class="button-container sm:min-w-40 w-full">
    <button [mat-dialog-close]="true" [disabled]="invalid()">Continue</button>
  </div>
</mat-dialog-actions>
