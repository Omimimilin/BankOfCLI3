spring.application.name=bank3

# db - ECS sets these on AWS, defaults are for local
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hibernate}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}

# set JWT_SECRET on AWS
app.jwt.secret=${JWT_SECRET:mysecretkeymysecretkeymysecretkeymysecretkey}

# comma separated, cloudfront url gets added in ECS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000}

# /actuator/health for the ECS health check
management.endpoints.web.exposure.include=health
